<style>
    @keyframes progressPulse {
      0% {
        transform: translateX(-100%);
      }
      50% {
        transform: translateX(20%);
      }
      100% {
        transform: translateX(110%);
      }
    }
    
    @keyframes subtleGlow {
      0%, 100% {
        opacity: 0.35;
        transform: scale(1);
      }
      50% {
        opacity: 0.55;
        transform: scale(1.06);
      }
    }

    .animate-progress {
      animation: progressPulse 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .animate-ambient-glow {
      animation: subtleGlow 6s ease-in-out infinite;

<script>
    // Micro-interaction: Subtle dynamic feedback when touching screen
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.querySelector('main');
      if (container) {
        container.addEventListener('pointerdown', (e) => {
          const ripple = document.createElement('div');
          ripple.className = 'absolute rounded-full pointer-events-none bg-surface/10 duration-700 animate-ping';
          ripple.style.width = '100px';
          ripple.style.height = '100px';
          ripple.style.left = `${e.clientX - 50}px`;
          ripple.style.top = `${e.clientY - 50}px`;
          ripple.style.transform = 'translate(-50%, -50%)';
          container.appendChild(ripple);
          setTimeout(() => ripple.remove(), 700);
        });
      }
    });
  </script>
