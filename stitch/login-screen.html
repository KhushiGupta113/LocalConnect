      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col justify-between items-center selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Mobile Viewport Container mimicking Android Phone Canvas -->
<div class="w-full max-w-[420px] min-h-screen bg-surface flex flex-col justify-between shadow-[0px_4px_24px_rgba(23,77,59,0.06)] relative border-x border-outline-variant/30">
<!-- Top Section: Android Status Bar & Content Header -->
<div class="flex flex-col w-full">
<!-- Android System Status Bar -->
<div class="w-full h-8 px-6 pt-2 pb-1 flex justify-between items-center select-none text-on-surface">
<span class="text-label-md font-label-md tracking-tight font-semibold">9:41</span>
<div class="flex items-center space-x-1.5 opacity-85">
<span class="material-symbols-outlined text-[16px]">wifi</span>
<span class="material-symbols-outlined text-[16px]">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[16px]">battery_full</span>
</div>
</div>
<!-- Main Navigation / Top Action Bar -->
<div class="px-margin pt-space-xs pb-space-sm flex items-center justify-between">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<!-- Brand Indicator -->
<div class="flex items-center space-x-2 bg-surface-container-low px-3 py-1.5 rounded-full border border-outline-variant/40">
<img alt="LocalConnect Logo" class="w-5 h-5 object-contain rounded-md" src="https://lh3.googleusercontent.com/aida/ALJJyrCONripHkYpwsMMZaPo9OCsRTRrBR3xiDffVMNW2HxWbNe2QI5At_ecDWZ7foloEtZ1M3ZhgwG6QskSnJPpeazNTGPlSC4w9ZmghRoxHCwX4SwIGe75ZAkrHABYd4n9b5-uSAarCXTwMfi5arkRi19cnyPCT_Jn2FgjzHBOjv02lMT9wK7ahHBrFlN4GUQpHVjzwFFbTSiEj2Zq_Mr8_0ZDejo5PVUq66q-OMSc35fA">
<span class="text-label-md font-label-md text-primary font-bold tracking-tight">LocalConnect</span>
</div>
<!-- Spacer to balance back button -->
<div class="w-10"></div>
</div>
<!-- Welcome Title & Neighborhood Subtitle -->
<div class="px-margin pt-space-sm pb-space-md">
<div class="inline-flex items-center space-x-1.5 text-on-tertiary-fixed-variant bg-surface-container-high px-2.5 py-1 rounded-full mb-2">
<span class="material-symbols-outlined text-[14px]">location_on</span>
<span class="text-label-sm font-label-sm font-semibold">Oakridge Commons Hub</span>
</div>
<h1 class="text-display-lg-mobile font-display-lg-mobile text-on-surface tracking-tight">Welcome back</h1>
<p class="text-body-md font-body-md text-on-surface-variant mt-1">Sign in to see what's happening around Oakridge Commons</p>
</div>
<!-- Authentication Form -->
<form class="px-margin space-y-space-md mt-space-xs" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="space-y-1.5">
<label class="block text-label-md font-label-md text-on-surface-variant" for="email">Email address</label>
<div class="relative flex items-center">
<div class="absolute left-3.5 text-on-surface-variant/60 flex items-center pointer-events-none">
<span class="material-symbols-outlined">mail</span>
</div>
<input autocomplete="email" class="w-full h-12 pl-11 pr-4 bg-surface-container-lowest border border-outline-variant/60 rounded-xl text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:border-primary-container focus:ring-0 focus:outline-none transition-colors" id="email" placeholder="sarah.jenkins@example.com" type="email">
</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<label class="block text-label-md font-label-md text-on-surface-variant" for="password">Password</label>
<div class="relative flex items-center">
<div class="absolute left-3.5 text-on-surface-variant/60 flex items-center pointer-events-none">
<span class="material-symbols-outlined">lock</span>
</div>
<input autocomplete="current-password" class="w-full h-12 pl-11 pr-11 bg-surface-container-lowest border border-outline-variant/60 rounded-xl text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:border-primary-container focus:ring-0 focus:outline-none transition-colors" id="password" placeholder="••••••••••••" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 text-on-surface-variant/70 hover:text-on-surface p-1 rounded-full active:scale-95 transition-all flex items-center justify-center" id="toggle-pwd-btn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined" id="pwd-icon">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end pt-0.5">
<a class="text-label-md font-label-md text-primary-container hover:text-primary transition-colors underline-offset-2 hover:underline" href="#">Forgot password?</a>
</div>
<!-- Primary CTA: Full-width Pill Button -->
<div class="pt-2">
<button class="w-full h-12 bg-primary-container text-on-primary rounded-full text-label-lg font-label-lg tracking-wide shadow-sm hover:opacity-95 active:scale-[0.98] transition-all flex items-center justify-center space-x-2" type="submit">
<span>Log In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Quick Sign-In Divider -->
<div class="px-margin pt-space-lg pb-space-sm">
<div class="relative flex items-center justify-center">
<div class="w-full border-t border-outline-variant/40"></div>
<span class="absolute bg-surface px-3 text-label-sm font-label-sm text-on-surface-variant">or continue with</span>
</div>
</div>
<!-- Social / Quick Sign-In Actions -->
<div class="px-margin grid grid-cols-2 gap-space-sm pt-space-xs">
<!-- Google Button -->
<button class="h-12 bg-surface-container-lowest border border-outline-variant/50 rounded-full flex items-center justify-center space-x-2 text-label-md font-label-md text-on-surface hover:bg-surface-container-low active:scale-95 transition-all shadow-[0px_2px_4px_rgba(23,77,59,0.02)]" type="button">
<svg class="w-4 h-4" viewBox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3h3.86c2.26-2.09 3.685-5.17 3.685-9.09z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.37 24 12 24z" fill="#34A853"></path>
<path d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.13-1.57.38-2.29V6.61H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.39l3.98-3.1z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.37 0 3.26 2.7 1.29 6.61l3.98 3.09c.95-2.85 3.6-4.95 6.73-4.95z" fill="#EA4335"></path>
</svg>
<span>Google</span>
</button>
<!-- Passkey Button -->
<button class="h-12 bg-surface-container-lowest border border-outline-variant/50 rounded-full flex items-center justify-center space-x-2 text-label-md font-label-md text-on-surface hover:bg-surface-container-low active:scale-95 transition-all shadow-[0px_2px_4px_rgba(23,77,59,0.02)]" type="button">
<span class="material-symbols-outlined text-primary-container text-[20px]">fingerprint</span>
<span>Passkey</span>
</button>
</div>
</div>
<!-- Bottom Footer Anchor: Registration Prompt & Android Gesture Indicator -->
<div class="w-full flex flex-col items-center pb-2 pt-6">
<div class="text-center py-2">
<span class="text-body-md font-body-md text-on-surface-variant">Don't have an account? </span>
<a class="text-label-lg font-label-lg text-primary-container font-semibold hover:underline" href="#">Sign up</a>
</div>
<!-- Android Bottom Gesture Pill -->
<div class="w-32 h-1 bg-on-surface/20 rounded-full mt-3 mb-1"></div>
</div>
</div>
<!-- Inline vanilla JS for password toggle interaction -->
<script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const pwdIcon = document.getElementById('pwd-icon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        pwdIcon.textContent = 'visibility_off';
      } else {
        pwdInput.type = 'password';
        pwdIcon.textContent = 'visibility';
      }
    }
  </script>


</body></html>
